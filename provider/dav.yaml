identity:
  author: shaba
  name: dav
  label:
    en_US: DAV
  description:
    en_US: DAV — CalDAV calendar events and tasks, CardDAV contacts plus WebDAV file utilities on any DAV server (Nextcloud, Radicale, …)
  icon: icon.svg
  tags:
    - productivity
credentials_for_provider:
  caldav_url:
    type: text-input
    required: false
    label:
      en_US: CalDAV URL
    placeholder:
      en_US: https://calendar.example.org/dav/alice/
    help:
      en_US: Base CalDAV URL of your server (e.g. Nextcloud https://example.com/remote.php/dav/). Leave empty when only CardDAV is used.
    url: https://example.com/remote.php/dav/
  caldav_username:
    type: text-input
    required: false
    label:
      en_US: CalDAV username
    placeholder:
      en_US: alice
    help:
      en_US: CalDAV account user name
  caldav_password:
    type: secret-input
    required: false
    label:
      en_US: CalDAV password
    help:
      en_US: CalDAV account password or app password
  carddav_url:
    type: text-input
    required: false
    label:
      en_US: CardDAV URL
    placeholder:
      en_US: https://contacts.example.net/remote.php/dav/
    help:
      en_US: >-
        Base/discovery URL of the CardDAV server. For Nextcloud use
        https://example.com/remote.php/dav/ ; for Radicale the account URL
        (e.g. https://example.com/radicale/user/). Leave empty when only CalDAV is used.
    url: https://example.com/remote.php/dav/
  carddav_username:
    type: text-input
    required: false
    label:
      en_US: CardDAV username
    placeholder:
      en_US: bob
    help:
      en_US: CardDAV account username
  carddav_password:
    type: secret-input
    required: false
    label:
      en_US: CardDAV password
    help:
      en_US: CardDAV account password or app password
  webdav_url:
    type: text-input
    required: false
    label:
      en_US: WebDAV URL
    placeholder:
      en_US: https://example.com/remote.php/dav/files/alice/
    help:
      en_US: >-
        Base WebDAV endpoint of your server, e.g.
        https://example.com/remote.php/dav/files/alice/ . Leave empty when
        only CalDAV/CardDAV is used.
    url: https://example.com/remote.php/dav/files/alice/
  webdav_username:
    type: text-input
    required: false
    label:
      en_US: WebDAV username
    placeholder:
      en_US: alice
    help:
      en_US: WebDAV account user name
  webdav_password:
    type: secret-input
    required: false
    label:
      en_US: WebDAV password
    help:
      en_US: WebDAV account password or app password
tools:
  - tools/caldav/list_calendars.yaml
  - tools/caldav/list_events.yaml
  - tools/caldav/search_events.yaml
  - tools/caldav/list_tasks.yaml
  - tools/caldav/create_event.yaml
  - tools/caldav/create_task.yaml
  - tools/carddav/list_addressbooks.yaml
  - tools/carddav/list_contacts.yaml
  - tools/carddav/search_contacts.yaml
  - tools/carddav/get_contact.yaml
  - tools/carddav/create_contact.yaml
  - tools/webdav/list_files.yaml
  - tools/webdav/stat_file.yaml
  - tools/webdav/read_file.yaml
  - tools/webdav/write_file.yaml
  - tools/webdav/delete_file.yaml
  - tools/webdav/create_directory.yaml
  - tools/webdav/move_file.yaml
  - tools/webdav/copy_file.yaml
extra:
  python:
    source: provider/dav.py
