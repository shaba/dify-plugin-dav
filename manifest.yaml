version: 0.0.1
type: plugin
author: shaba
name: dav
repo: https://github.com/shaba/dify-plugin-dav
contact: shaba@altlinux.org
label:
  en_US: DAV (CalDAV + CardDAV + WebDAV)
description:
  en_US: "CalDAV calendar events and tasks, CardDAV contacts and WebDAV file utilities on any DAV server (Nextcloud, Radicale, …). Knowledge-base ingestion of WebDAV files stays with the separate shaba/webdav datasource plugin."
icon: icon.svg
resource:
