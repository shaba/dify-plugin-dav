  permission:
    model:
      enabled: false
    node:
      enabled: false
privacy: PRIVACY.md
plugins:
  tools:
    - provider/dav.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.19.0
tags:
  - productivity
created_at: "2026-11-11T00:00:00Z"
