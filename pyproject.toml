[project]
name = "dify-plugin-dav"
version = "0.0.1"
description = "CalDAV calendar events and tasks plus CardDAV contacts on any DAV server"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dify_plugin>=0.11.0,<0.12.0",
    "caldav>=3.7.0,<4",
    "requests>=2.32",
    "vobject>=0.9",
    "icalendar>=7.3.0,<8",
    "lxml>=5",]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
